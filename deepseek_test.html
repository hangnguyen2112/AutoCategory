<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek API Test Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151c2c;
      --border: #232d42;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: #0d121f;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      cursor: pointer;
      user-select: none;
      width: fit-content;
    }

    .toggle-group input[type="checkbox"] {
      cursor: pointer;
    }

    .toggle-label {
      font-size: 14px;
      color: var(--text);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
      font-family: inherit;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-section {
      margin-top: 24px;
      display: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .meta-info {
      font-size: 13px;
      color: var(--text-muted);
    }

    .box {
      background: #0d121f;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .box-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }

    .thinking-box {
      border-left: 3px solid var(--gold);
      color: var(--gold);
      background: rgba(245, 158, 11, 0.03);
    }

    .content-box {
      border-left: 3px solid var(--accent);
      color: var(--text);
    }

    .box-info {
      border-left: 3px solid var(--success);
      color: var(--text);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🐳 DeepSeek API Test Console</h1>
  <div class="subtitle">Kiểm tra phản hồi thực tế của model, trạng thái suy nghĩ (Thinking Mode) và KV Cache.</div>

  <div class="form-group">
    <label for="apiKey">API Key (platform.deepseek.com)</label>
    <input type="password" id="apiKey" placeholder="Nhập sk_..." value="">
  </div>

  <div class="form-group">
    <label for="model">Mô hình (Model Name)</label>
    <input type="text" id="model" value="deepseek-v4-flash" placeholder="Ví dụ: deepseek-v4-flash, deepseek-chat">
  </div>

  <div class="form-group">
    <label for="prompt">Câu hỏi kiểm tra (Prompt)</label>
    <textarea id="prompt" rows="3" placeholder="Nhập câu hỏi test">What is your exact model version? Reply in one short sentence.</textarea>
  </div>

  <div class="form-group">
    <label class="toggle-group">
      <input type="checkbox" id="chkThinking" checked>
      <span class="toggle-label">Bật Thinking Mode (Chỉ có tác dụng với dòng mô hình V4/R1)</span>
    </label>
  </div>

  <button class="btn-submit" id="btnSend" onclick="sendTestRequest()">Gửi Request</button>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <span class="badge" id="statusBadge">Thành công</span>
      <span class="meta-info" id="metaInfo">Độ trễ: 0ms</span>
    </div>

    <div class="box thinking-box" id="thinkingBoxWrapper" style="display: none;">
      <div class="box-title">💭 Chain of Thought (Suy nghĩ của AI)</div>
      <pre id="thinkingContent"></pre>
    </div>

    <div class="box content-box">
      <div class="box-title">💬 Response Content (Kết quả trả về chính)</div>
      <pre id="responseContent"></pre>
    </div>

    <div class="box box-info" id="tokenUsageBox">
      <div class="box-title">📊 Token Usage & KV Cache</div>
      <pre id="usageContent"></pre>
    </div>
  </div>
</div>

<script>
  // Tự động load API key đã lưu nếu có
  document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('deepseek_test_key');
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
    }
  });

  async function sendTestRequest() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const model = document.getElementById('model').value.trim();
    const prompt = document.getElementById('prompt').value.trim();
    const useThinking = document.getElementById('chkThinking').checked;

    if (!apiKey) {
      alert('Vui lòng nhập API Key!');
      return;
    }

    // Lưu API key vào localStorage để tiện dùng lần sau
    localStorage.setItem('deepseek_test_key', apiKey);

    const btn = document.getElementById('btnSend');
    const resultSection = document.getElementById('resultSection');
    const statusBadge = document.getElementById('statusBadge');
    const metaInfo = document.getElementById('metaInfo');
    const thinkingBoxWrapper = document.getElementById('thinkingBoxWrapper');
    const thinkingContent = document.getElementById('thinkingContent');
    const responseContent = document.getElementById('responseContent');
    const usageContent = document.getElementById('usageContent');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Đang xử lý request...';
    resultSection.style.display = 'none';
    thinkingBoxWrapper.style.display = 'none';

    // Tạo payload chuẩn
    const payload = {
      model: model,
      messages: [
        { role: "user", content: prompt }
      ],
      stream: false,
      temperature: 0.1
    };

    // Bật/tắt suy nghĩ
    if (!useThinking) {
      payload.thinking = { type: "disabled" };
    } else {
      payload.thinking = { type: "enabled" };
    }

    const startTime = performance.now();

    try {
      const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(payload)
      });

      const endTime = performance.now();
      const latency = Math.round(endTime - startTime);
      metaInfo.textContent = `Độ trễ: ${latency}ms`;

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error?.message || response.statusText);
      }

      const data = await response.json();
      const message = data.choices[0].message;

      statusBadge.className = 'badge badge-success';
      statusBadge.textContent = 'Thành công';

      // Hiển thị reasoning content nếu có
      if (message.reasoning_content) {
        thinkingBoxWrapper.style.display = 'block';
        thinkingContent.textContent = message.reasoning_content;
      }

      // Hiển thị content chính
      responseContent.textContent = message.content || "(Phản hồi trống)";

      // Hiển thị token usage và KV cache hit
      const usage = data.usage || {};
      const usageText = 
`Tổng số tokens sử dụng: ${usage.total_tokens}
- Tokens đầu vào: ${usage.prompt_tokens}
  * Cache Hit (KV Cache): ${usage.prompt_tokens_details?.cached_tokens || usage.prompt_cache_hit_tokens || 0} tokens
  * Cache Miss (Tính toán lại): ${usage.prompt_cache_miss_tokens || (usage.prompt_tokens - (usage.prompt_tokens_details?.cached_tokens || usage.prompt_cache_hit_tokens || 0))} tokens
- Tokens đầu ra: ${usage.completion_tokens}`;
      
      usageContent.textContent = usageText;
      resultSection.style.display = 'block';

    } catch (error) {
      statusBadge.className = 'badge badge-danger';
      statusBadge.textContent = 'Thất bại';
      responseContent.textContent = `Lỗi: ${error.message}`;
      usageContent.textContent = "Không thể lấy thông tin token usage.";
      resultSection.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Gửi Request';
    }
  }
</script>

</body>
</html>
