# One-service Cloudflare Tunnel HA overlay.
# On every Docker host, cloudflared discovers/creates the remote tunnel,
# starts a replica, waits for readiness, and publishes DNS automatically.
services:
  cloudflared:
    build:
      context: ./cloudflare
      dockerfile: Dockerfile.ha
    image: autocategory-cloudflared-ha
    container_name: autocategory_tunnel
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
      CF_TUNNEL_NAME: ${CF_TUNNEL_NAME:-autocategory-ha}
      CF_ORIGIN_SERVICE: ${CF_ORIGIN_SERVICE:-http://nginx:80}
      CF_CONNECTOR_WAIT_SECONDS: ${CF_CONNECTOR_WAIT_SECONDS:-180}
    volumes:
      - cf_runtime:/cf-runtime
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/cloudflared.pid && kill -0 $$(cat /tmp/cloudflared.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles: !reset []
