# Giới hạn log Docker cho tất cả container (tránh đầy ổ cứng)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: autocategory_qdrant
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'true < /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: autocategory_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: autocategory
      POSTGRES_USER: ${POSTGRES_USER:-autocategory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocategory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: autocategory_redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: autocategory_api
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      OMNI_BASE_URL: ${OMNI_BASE_URL:-}
      OMNI_SYNC_MODE: ${OMNI_SYNC_MODE:-manual}
      OMNI_SYNC_INTERVAL_HOURS: ${OMNI_SYNC_INTERVAL_HOURS:-24}
      CATEGORY_ATTRIBUTES_JSON_PATH: /app/data/category_attributes.json
      DEEPSEEK_PROXY_URL: http://deepseek-proxy:8002
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_WARN_SECONDS: ${DB_POOL_WARN_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api/data:/app/data
      - ./api/logs:/app/logs
      - ./api/migrations:/app/migrations:ro
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      deepseek-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 5

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: autocategory_admin
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      api:
        condition: service_healthy

  deepseek-proxy:
    build:
      context: ./deepseek-proxy
      dockerfile: Dockerfile
    container_name: autocategory_deepseek_proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cloudflare Tunnel setup (run once, then stop)
  cf-setup:
    build:
      context: ./cloudflare
      dockerfile: Dockerfile.setup
    container_name: autocategory_cf_setup
    env_file: .env
    volumes:
      - cf_runtime:/cf-runtime
    restart: "no"
    profiles:
      - setup

  # Cloudflare Tunnel daemon
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: autocategory_tunnel
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --config /cf-runtime/config.yml run
    volumes:
      - cf_runtime:/cf-runtime:ro
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - tunnel

  nginx:
    image: nginx:alpine
    container_name: autocategory_nginx
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "3001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
      admin-dashboard:
        condition: service_started

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  cf_runtime:
